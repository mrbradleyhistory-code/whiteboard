<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Cards</title>
  <style>
    :root {
      --accent: #6366f1;
      --accent-dark: #4f46e5;
      --accent-light: #eef2ff;
      --surface: #ffffff;
      --surface-muted: #fafaf9;
      --border: #e7e5e4;
      --text: #1c1917;
      --text-muted: #78716c;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --success: #059669;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f5f5f4;
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    button, input, textarea {
      font: inherit;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .app-header {
      margin-bottom: 28px;
    }

    .app-header h1 {
      margin: 0 0 6px;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .app-header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface-muted);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn:hover { filter: brightness(0.97); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn--primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn--primary:hover:not(:disabled) { background: var(--accent-dark); }
    .btn--danger { background: var(--danger-bg); color: var(--danger); border-color: #fecaca; }
    .btn--ghost { background: transparent; border-color: transparent; min-width: 44px; padding: 8px; }

    .input, .textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 15px;
    }

    .textarea { resize: vertical; min-height: 100px; }

    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .row > .input { flex: 1; min-width: 160px; }

    .hint { color: var(--text-muted); font-size: 0.85rem; margin: 8px 0 0; }
    .alert { background: var(--danger-bg); color: var(--danger); padding: 10px 14px; border-radius: var(--radius); margin: 12px 0; font-size: 0.9rem; }

    .deck-list { list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }

    .deck-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      background: var(--surface-muted);
    }

    .deck-card__header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .deck-card__title { font-weight: 700; font-size: 1.05rem; }
    .deck-card__meta { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }

    .deck-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .deck-actions .btn { font-size: 13px; min-height: 40px; padding: 8px 12px; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-bottom: 16px;
      font-size: 15px;
    }

    .deck-title-input {
      font-size: 1.4rem;
      font-weight: 700;
      border: none;
      border-bottom: 2px solid var(--border);
      border-radius: 0;
      padding: 4px 0;
      margin-bottom: 16px;
      background: transparent;
    }

    .block-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin: 0 0 10px;
    }

    .import-block {
      margin: 24px 0;
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      background: var(--surface);
    }

    .card-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

    .card-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty h2 { margin: 0 0 8px; color: var(--text); font-size: 1.1rem; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

    .data-toolbar {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    /* Presenter fullscreen */
    .presenter {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: #1a1d21;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px 28px 28px;
    }

    .presenter__bar {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 18px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .presenter__bar span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9aa3ad; }
    .presenter__exit { border: 1px solid #5c6570; background: transparent; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }

    .presenter__label {
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      text-align: center;
      margin: 0 0 12px;
    }

    .presenter__prompt {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(32px, 6vw, 72px);
      font-weight: 700;
      line-height: 1.2;
      padding: 20px;
      white-space: pre-wrap;
    }

    .presenter__prompt--quiz { flex: 0 1 auto; max-height: 28vh; font-size: clamp(28px, 4.5vw, 56px); }

    .presenter__choices { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; max-width: 900px; width: 100%; margin-inline: auto; }

    .presenter__choice {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border: 2px solid #3d4450;
      border-radius: 14px;
      background: #252a31;
      font-size: clamp(20px, 3vw, 32px);
    }

    .presenter__choice--correct { border-color: #2a9d8f; background: #1e3d38; }

    .presenter__choice-num {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #3d4450;
      font-weight: 700;
      font-size: 18px;
    }

    .presenter__choice--correct .presenter__choice-num { background: #2a9d8f; }

    .presenter__hint { text-align: center; font-size: 16px; color: #9aa3ad; margin: 16px 0 0; }

    .presenter__feedback { text-align: center; font-size: 22px; font-weight: 700; color: #6ee7b7; margin: 8px 0; }

    .presenter__nav { display: flex; gap: 16px; justify-content: center; margin-top: 20px; flex-shrink: 0; }

    .presenter__nav-btn {
      min-width: min(260px, 42vw);
      min-height: 64px;
      padding: 14px 24px;
      border-radius: 14px;
      border: 2px solid #5c6570;
      background: #2d333b;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .presenter__nav-btn:disabled { opacity: 0.35; cursor: default; }
    .presenter__nav-btn--primary { border-color: var(--accent); background: var(--accent); }

    .presenter__done { font-size: 42px; margin: auto; text-align: center; }
    .presenter__actions { display: flex; gap: 16px; justify-content: center; margin-top: 24px; }

    /* Study session */
    .study { max-width: 560px; margin: 0 auto; padding: 8px 0; }

    .study__progress { color: var(--text-muted); margin-bottom: 16px; }

    .study__flip {
      width: 100%;
      min-height: 220px;
      padding: 32px;
      border-radius: 16px;
      border: 2px solid var(--accent);
      background: var(--surface);
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      white-space: pre-wrap;
      cursor: pointer;
    }

    .study__label { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; margin: 0 0 8px; }

    .study__prompt {
      padding: 28px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }

    .study__choices { display: flex; flex-direction: column; gap: 10px; }

    .study__choice {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
      font-size: 16px;
    }

    .study__choice--correct { background: #d1fae5 !important; }
    .study__choice--wrong { background: var(--danger-bg) !important; }
    .study__choice--highlight { border: 2px solid var(--accent); background: var(--accent-light); }

    .study__summary { text-align: center; padding: 40px 20px; }
    .study__summary h2 { margin: 0 0 16px; }

    .hidden { display: none !important; }

    @media (max-width: 560px) {
      .card-row { grid-template-columns: 1fr; }
      .deck-card__header { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="root" class="app"></div>

  <script>
    const STORAGE_KEY = 'vocab-cards-decks-v1';

    // --- Data layer (localStorage) ---

    function nowIso() {
      return new Date().toISOString();
    }

    function newCardId() {
      return 'card_' + crypto.randomUUID().slice(0, 8);
    }

    function newDeckId() {
      return crypto.randomUUID();
    }

    function normalizeCards(cards) {
      if (!Array.isArray(cards)) return [];
      return cards
        .filter(c => c && (c.front || c.back))
        .map(c => ({
          id: c.id || newCardId(),
          front: String(c.front ?? '').trim(),
          back: String(c.back ?? '').trim(),
        }))
        .filter(c => c.front || c.back);
    }

    function loadDecks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const decks = JSON.parse(raw);
        if (!Array.isArray(decks)) return [];
        return decks.sort((a, b) => String(b.updated_at || '').localeCompare(String(a.updated_at || '')));
      } catch {
        return [];
      }
    }

    function saveDecks(decks) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(decks));
    }

    function createDeck(name, cards = []) {
      const deck = {
        id: newDeckId(),
        name,
        cards: normalizeCards(cards),
        created_at: nowIso(),
        updated_at: nowIso(),
      };
      const decks = loadDecks();
      decks.unshift(deck);
      saveDecks(decks);
      return deck;
    }

    function updateDeck(deckId, patch) {
      const decks = loadDecks();
      const idx = decks.findIndex(d => d.id === deckId);
      if (idx < 0) return null;
      const next = { ...decks[idx], ...patch, updated_at: nowIso() };
      if (patch.cards != null) next.cards = normalizeCards(patch.cards);
      decks[idx] = next;
      saveDecks(decks);
      return next;
    }

    function deleteDeck(deckId) {
      const decks = loadDecks().filter(d => d.id !== deckId);
      saveDecks(decks);
    }

    // --- Import parsing ---

    function stripBom(text) {
      return text.replace(/^\uFEFF/, '');
    }

    function parseCsvLine(line) {
      const out = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          out.push(cur.trim());
          cur = '';
        } else cur += ch;
      }
      out.push(cur.trim());
      return out;
    }

    function splitPair(line) {
      const trimmed = line.trim();
      if (!trimmed) return null;
      const tab = trimmed.indexOf('\t');
      if (tab > 0) return { front: trimmed.slice(0, tab).trim(), back: trimmed.slice(tab + 1).trim() };
      const csv = parseCsvLine(trimmed);
      if (csv.length >= 2) return { front: csv[0], back: csv.slice(1).join(', ') };
      const colon = trimmed.match(/^(.+?)\s*:\s+(.+)$/);
      if (colon) return { front: colon[1].trim(), back: colon[2].trim() };
      const dash = trimmed.match(/^(.+?)\s+[-–—]\s+(.+)$/);
      if (dash) return { front: dash[1].trim(), back: dash[2].trim() };
      const comma = trimmed.indexOf(',');
      if (comma > 0) return { front: trimmed.slice(0, comma).trim(), back: trimmed.slice(comma + 1).trim() };
      return null;
    }

    function parseFlashcardImport(text) {
      const errors = [];
      const normalized = stripBom(text || '').replace(/\r\n/g, '\n');
      const lines = normalized.split('\n');
      const cards = [];
      const seen = new Set();
      for (const line of lines) {
        const pair = splitPair(line);
        if (!pair || (!pair.front && !pair.back)) continue;
        const key = pair.front + '\0' + pair.back;
        if (seen.has(key)) continue;
        seen.add(key);
        cards.push({ id: newCardId(), front: pair.front, back: pair.back });
      }
      if (cards.length === 0) {
        errors.push('No cards found. Use tab-separated (Quizlet), CSV, or "term - definition" per line.');
      }
      return { cards, errors };
    }

    // --- Study helpers ---

    function shuffleCards(cards) {
      const a = [...cards];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickTermChoices(cards, correctCard, count = 4) {
      const wrong = shuffleCards(cards.filter(c => c.id !== correctCard.id)).slice(0, count - 1);
      const choices = shuffleCards([correctCard, ...wrong]);
      while (choices.length < count) {
        choices.push({ id: 'pad_' + choices.length, front: '—', back: '—' });
      }
      return choices.slice(0, count);
    }

    function presentationPageDelta(key) {
      switch (key) {
        case 'PageDown': case 'ArrowRight': case 'ArrowDown': case ' ': case 'MediaTrackNext': return 1;
        case 'PageUp': case 'ArrowLeft': case 'ArrowUp': case 'MediaTrackPrevious': return -1;
        default: return 0;
      }
    }

    function requestFullscreen(el) {
      if (!el) return Promise.resolve();
      if (el.requestFullscreen) return el.requestFullscreen().catch(() => {});
      if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
      return Promise.resolve();
    }

    function exitFullscreen() {
      if (document.fullscreenElement && document.exitFullscreen) return document.exitFullscreen().catch(() => {});
      if (document.webkitFullscreenElement && document.webkitExitFullscreen) return document.webkitExitFullscreen();
      return Promise.resolve();
    }

    function downloadJson(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // --- App state ---

    const state = {
      view: 'list', // list | edit | present | study
      decks: loadDecks(),
      editingDeck: null,
      newDeckName: '',
      importText: '',
      importPreview: null,
      error: '',
      present: null, // { deck, mode }
      study: null,   // { deck, mode }
    };

    const root = document.getElementById('root');

    function setState(patch) {
      Object.assign(state, patch);
      render();
    }

    function getDeck(id) {
      return state.decks.find(d => d.id === id) || loadDecks().find(d => d.id === id);
    }

    function refreshDecks() {
      state.decks = loadDecks();
    }

    // --- Render helpers ---

    function el(tag, attrs, ...children) {
      const node = document.createElement(tag);
      if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
          if (k === 'className') node.className = v;
          else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
          else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
          else if (v != null) node.setAttribute(k, v);
        }
      }
      for (const child of children.flat()) {
        if (child == null) continue;
        node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
      }
      return node;
    }

    function btn(label, opts = {}) {
      const { variant, onClick, disabled, className } = opts;
      const classes = ['btn'];
      if (variant === 'primary') classes.push('btn--primary');
      if (variant === 'danger') classes.push('btn--danger');
      if (variant === 'ghost') classes.push('btn--ghost');
      if (className) classes.push(className);
      return el('button', { type: 'button', className: classes.join(' '), onClick, disabled: disabled || undefined }, label);
    }

    function deckActions(deck, onPresent, onStudy) {
      const count = (deck.cards || []).length;
      return el('div', { className: 'deck-actions' },
        btn('Present — cycle', { variant: 'primary', disabled: !count, onClick: () => onPresent({ deck, mode: 'cycle' }) }),
        btn('Present — quiz', { variant: 'primary', disabled: count < 4, onClick: () => onPresent({ deck, mode: 'quiz' }) }),
        btn('Practice — flip', { disabled: !count, onClick: () => onStudy({ deck, mode: 'flip' }) }),
        btn('Practice — quiz', { disabled: count < 4, onClick: () => onStudy({ deck, mode: 'mc' }) }),
      );
    }

    // --- Presenter ---

    function renderPresenter(deck, mode, onExit) {
      const container = el('div', { className: 'presenter' });
      let cards = shuffleCards(deck.cards || []);
      let index = 0;
      let cyclePhase = 'term';
      let revealed = false;
      let choices = [];

      function current() { return cards[index]; }
      function done() { return index >= cards.length; }

      function refreshChoices() {
        if (mode === 'quiz' && current() && !done()) {
          choices = pickTermChoices(cards, current());
          revealed = false;
        }
      }

      function goNextCard() {
        index++;
        cyclePhase = 'term';
        revealed = false;
        refreshChoices();
        paint();
      }

      function goPrevCard() {
        index = Math.max(0, index - 1);
        cyclePhase = 'term';
        revealed = false;
        refreshChoices();
        paint();
      }

      function cycleForward() {
        if (cyclePhase === 'term') { cyclePhase = 'def'; paint(); }
        else goNextCard();
      }

      function cycleBack() {
        if (cyclePhase === 'def') { cyclePhase = 'term'; paint(); }
        else if (index > 0) goPrevCard();
      }

      function quizForward() {
        if (!revealed) { revealed = true; paint(); }
        else goNextCard();
      }

      function quizBack() {
        if (revealed) { revealed = false; paint(); }
        else if (index > 0) goPrevCard();
      }

      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); onExit(); return; }
        const delta = presentationPageDelta(e.key);
        if (delta === 0) return;
        e.preventDefault();
        if (mode === 'cycle') {
          if (delta === 1) cycleForward();
          else cycleBack();
        } else {
          if (delta === 1) quizForward();
          else quizBack();
        }
      }

      function paint() {
        container.innerHTML = '';
        const canGoBack = mode === 'cycle'
          ? (cyclePhase === 'def' || index > 0)
          : (revealed || index > 0);

        const bar = el('header', { className: 'presenter__bar' },
          el('span', null, deck.name),
          el('span', null, done() ? '' : (index + 1) + ' / ' + cards.length),
          el('span', null, mode === 'cycle' ? 'Cycle' : 'Quiz'),
          el('button', { type: 'button', className: 'presenter__exit', onClick: onExit }, 'Exit'),
        );

        if (!cards.length) {
          container.append(bar, el('p', { style: { margin: 'auto', textAlign: 'center' } }, 'This deck has no cards.'));
          return;
        }

        if (mode === 'quiz' && cards.length < 4) {
          container.append(bar, el('p', { style: { margin: 'auto', textAlign: 'center' } }, 'Quiz mode needs at least 4 cards.'));
          return;
        }

        if (done()) {
          container.append(
            bar,
            el('h2', { className: 'presenter__done' }, 'End of deck'),
            el('p', { className: 'presenter__hint' }, deck.name),
            el('div', { className: 'presenter__actions' },
              btn('Start over', { variant: 'primary', onClick: () => { index = 0; cyclePhase = 'term'; revealed = false; cards = shuffleCards(deck.cards || []); refreshChoices(); paint(); } }),
              btn('Exit', { onClick: onExit }),
            ),
          );
          return;
        }

        const cur = current();
        const nav = el('div', { className: 'presenter__nav' },
          el('button', { type: 'button', className: 'presenter__nav-btn', disabled: !canGoBack || undefined, onClick: () => mode === 'cycle' ? cycleBack() : quizBack() }, '← Back'),
          el('button', {
            type: 'button',
            className: 'presenter__nav-btn presenter__nav-btn--primary',
            onClick: () => mode === 'cycle' ? cycleForward() : quizForward(),
          }, mode === 'cycle'
            ? (cyclePhase === 'term' ? 'Show definition →' : 'Next card →')
            : (revealed ? 'Next question →' : 'Show answer →')),
        );

        if (mode === 'cycle') {
          container.append(
            bar,
            el('p', { className: 'presenter__label' }, cyclePhase === 'term' ? 'Term' : 'Definition'),
            el('div', { className: 'presenter__prompt' }, cyclePhase === 'term' ? cur.front : cur.back),
            el('p', { className: 'presenter__hint' }, 'Remote: Page Down = forward · Page Up = back · Or use the buttons below'),
            nav,
          );
        } else {
          const choiceList = el('ul', { className: 'presenter__choices' });
          choices.forEach((ch, i) => {
            const isCorrect = ch.id === cur.id;
            let cls = 'presenter__choice';
            if (revealed && isCorrect) cls += ' presenter__choice--correct';
            choiceList.appendChild(el('li', { className: cls },
              el('span', { className: 'presenter__choice-num' }, String(i + 1)),
              el('span', null, ch.front),
            ));
          });
          const parts = [
            bar,
            el('p', { className: 'presenter__label' }, 'Definition'),
            el('div', { className: 'presenter__prompt presenter__prompt--quiz' }, cur.back),
            choiceList,
            el('p', { className: 'presenter__hint' }, !revealed
              ? 'Page Down or Forward → reveal correct answer'
              : 'Answer: ' + cur.front + ' · Page Down or Forward → next'),
          ];
          if (revealed) parts.push(el('p', { className: 'presenter__feedback' }, 'Correct: ' + cur.front));
          parts.push(nav);
          parts.forEach(p => container.appendChild(p));
        }
      }

      window.addEventListener('keydown', onKey);
      requestFullscreen(container);
      refreshChoices();
      paint();

      return {
        el: container,
        destroy() {
          window.removeEventListener('keydown', onKey);
          exitFullscreen();
        },
      };
    }

    // --- Study session ---

    function renderStudySession(deck, mode, onBack) {
      const wrap = el('div', { className: 'study' });
      let cards = shuffleCards(deck.cards || []);
      let index = 0;
      let flipped = false;
      let gotIt = 0;
      let learning = 0;
      let mcScore = 0;
      let mcAnswered = 0;
      let mcFeedback = null;
      let choices = [];
      let choiceIndex = 0;

      function current() { return cards[index]; }
      function done() { return index >= cards.length; }

      function refreshChoices() {
        if (mode === 'mc' && current() && !done()) {
          choices = pickTermChoices(cards, current());
          mcFeedback = null;
          choiceIndex = 0;
        }
      }

      function onKey(e) {
        if (done()) return;
        const delta = presentationPageDelta(e.key);
        if (mode === 'flip') {
          if (delta === 1) {
            e.preventDefault();
            if (!flipped) flipped = true;
            else { index++; flipped = false; }
            paint();
          } else if (delta === -1 && index > 0) {
            e.preventDefault();
            index--;
            flipped = false;
            paint();
          }
          return;
        }
        if (mode === 'mc' && !mcFeedback) {
          if (delta !== 0) {
            e.preventDefault();
            const n = choices.length || 4;
            choiceIndex = delta === 1 ? (choiceIndex + 1) % n : (choiceIndex - 1 + n) % n;
            paint();
          }
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            submitChoice(choices[choiceIndex]);
          }
        }
      }

      function submitChoice(ch) {
        if (!ch || mcFeedback) return;
        mcAnswered++;
        if (ch.id === current().id) mcScore++;
        mcFeedback = ch.id;
        paint();
        setTimeout(() => { index++; mcFeedback = null; refreshChoices(); paint(); }, 700);
      }

      function paint() {
        wrap.innerHTML = '';

        if (!cards.length) {
          wrap.append(el('p', null, 'This deck has no cards.'), btn('Back', { onClick: onBack }));
          return;
        }

        if (mode === 'mc' && cards.length < 4) {
          wrap.append(el('p', null, 'Quiz mode needs at least 4 cards in the deck.'), btn('Back', { onClick: onBack }));
          return;
        }

        if (done()) {
          const summary = el('div', { className: 'study__summary' },
            el('h2', null, 'Session complete'),
            el('p', { style: { fontSize: '18px', color: 'var(--text-muted)' } },
              mode === 'flip'
                ? 'Got it: ' + gotIt + ' · Still learning: ' + learning
                : 'Score: ' + mcScore + ' / ' + mcAnswered),
            el('div', { className: 'row', style: { justifyContent: 'center', marginTop: '24px' } },
              btn('Study again', { variant: 'primary', onClick: () => {
                index = 0; gotIt = 0; learning = 0; mcScore = 0; mcAnswered = 0; flipped = false;
                cards = shuffleCards(deck.cards || []); refreshChoices(); paint();
              } }),
              btn('Back to decks', { onClick: onBack }),
            ),
          );
          wrap.appendChild(summary);
          return;
        }

        const cur = current();

        if (mode === 'flip') {
          wrap.append(
            el('p', { className: 'study__progress' }, 'Card ' + (index + 1) + ' of ' + cards.length),
            el('button', {
              type: 'button',
              className: 'study__flip',
              onClick: () => { flipped = !flipped; paint(); },
            }, flipped ? cur.back : cur.front),
            el('p', { className: 'hint', style: { textAlign: 'center' } }, 'Page Down → reveal / next · tap to flip'),
          );
          if (flipped) {
            wrap.append(el('div', { className: 'row', style: { marginTop: '24px' } },
              btn('Still learning', { onClick: () => { learning++; index++; flipped = false; paint(); }, className: 'study__choice', style: { flex: 1, background: 'var(--warn-bg)', color: 'var(--warn)', border: 'none' } }),
              btn('Got it', { variant: 'primary', onClick: () => { gotIt++; index++; flipped = false; paint(); }, style: { flex: 1 } }),
            ));
          }
          wrap.append(btn('Exit', { onClick: onBack, style: { marginTop: '24px' } }));
          return;
        }

        const choiceWrap = el('div', { className: 'study__choices' });
        choices.forEach((ch, i) => {
          const isCorrect = ch.id === cur.id;
          let cls = 'btn study__choice';
          if (mcFeedback && isCorrect) cls += ' study__choice--correct';
          if (mcFeedback === ch.id && !isCorrect) cls += ' study__choice--wrong';
          if (!mcFeedback && i === choiceIndex) cls += ' study__choice--highlight';
          choiceWrap.appendChild(el('button', {
            type: 'button',
            className: cls,
            disabled: !!mcFeedback || undefined,
            onClick: () => submitChoice(ch),
          }, el('strong', { style: { marginRight: '10px' } }, (i + 1) + '.'), ch.front));
        });

        wrap.append(
          el('p', { className: 'study__progress' }, 'Question ' + (index + 1) + ' of ' + cards.length),
          el('p', { className: 'study__label' }, 'Definition'),
          el('div', { className: 'study__prompt' }, cur.back),
          choiceWrap,
          el('p', { className: 'hint', style: { textAlign: 'center' } }, 'Page Down / Up → move highlight · Space → submit'),
          btn('Exit', { onClick: onBack, style: { marginTop: '24px' } }),
        );
      }

      window.addEventListener('keydown', onKey);
      refreshChoices();
      paint();

      return {
        el: wrap,
        destroy() { window.removeEventListener('keydown', onKey); },
      };
    }

    // --- Main views ---

    let activePresenter = null;
    let activeStudy = null;

    function renderList() {
      const frag = document.createDocumentFragment();

      frag.appendChild(el('header', { className: 'app-header' },
        el('h1', null, 'Vocab Cards'),
        el('p', null, 'Standalone flashcards — no login, no cloud. Data stays in this browser.'),
      ));

      const panel = el('div', { className: 'panel' },
        el('p', { className: 'hint', style: { marginTop: 0 } },
          'Present = fullscreen for class (Page Down / Up). Practice = self-review. Import from Quizlet, Knowt, or CSV.'),
      );

      panel.appendChild(el('div', { className: 'row', style: { marginTop: '16px' } },
        el('input', {
          className: 'input',
          placeholder: 'New deck name…',
          value: state.newDeckName,
          onInput: e => { state.newDeckName = e.target.value; },
          onKeydown: e => { if (e.key === 'Enter') handleCreateDeck(); },
        }),
        btn('+ New deck', { variant: 'primary', onClick: handleCreateDeck }),
      ));

      if (state.error) panel.appendChild(el('div', { className: 'alert' }, state.error));

      if (!state.decks.length) {
        panel.appendChild(el('div', { className: 'empty' },
          el('h2', null, 'No decks yet'),
          el('p', null, 'Create a deck with the field above, or import a JSON backup.'),
        ));
      } else {
        const list = el('ul', { className: 'deck-list' });
        state.decks.forEach(d => {
          list.appendChild(el('li', { className: 'deck-card' },
            el('div', { className: 'deck-card__header' },
              el('div', null,
                el('div', { className: 'deck-card__title' }, d.name),
                el('div', { className: 'deck-card__meta' }, (d.cards || []).length + ' cards'),
              ),
              el('div', { className: 'row' },
                btn('Edit', { onClick: () => openEdit(d.id) }),
                btn('Delete', { variant: 'danger', onClick: () => handleDeleteDeck(d.id) }),
              ),
            ),
            deckActions(d, startPresent, startStudy),
          ));
        });
        panel.appendChild(list);
      }

      const dataToolbar = el('div', { className: 'data-toolbar' },
        el('p', { className: 'block-title' }, 'Backup & share'),
        el('p', { className: 'hint' }, 'Export decks as JSON to move between computers or share with students. They can open this same page and import.'),
        el('div', { className: 'toolbar' },
          btn('Export all decks', { onClick: exportAllDecks }),
          btn('Import JSON', { onClick: () => document.getElementById('import-json-input').click() }),
        ),
      );
      panel.appendChild(dataToolbar);

      const fileInput = el('input', {
        id: 'import-json-input',
        type: 'file',
        accept: '.json,application/json',
        className: 'hidden',
        onChange: handleImportJson,
      });
      panel.appendChild(fileInput);

      frag.appendChild(panel);
      return frag;
    }

    function renderEdit() {
      const deck = state.editingDeck;
      if (!deck) return renderList();

      const frag = document.createDocumentFragment();

      frag.appendChild(el('button', { type: 'button', className: 'back-link', onClick: () => {
        refreshDecks();
        setState({ view: 'list', editingDeck: null, importText: '', importPreview: null, error: '' });
      } }, '← All decks'));

      frag.appendChild(el('input', {
        className: 'input deck-title-input',
        value: deck.name,
        onInput: e => { deck.name = e.target.value; },
        onBlur: () => {
          const updated = updateDeck(deck.id, { name: deck.name.trim() });
          if (updated) state.editingDeck = updated;
        },
        'aria-label': 'Deck name',
      }));

      frag.appendChild(deckActions(deck, startPresent, startStudy));

      frag.appendChild(btn('+ Add card', { onClick: addCard, style: { margin: '20px 0 24px' } }));

      const importBlock = el('div', { className: 'import-block' },
        el('p', { className: 'block-title' }, 'Import from Quizlet / Knowt / CSV'),
        el('textarea', {
          className: 'textarea',
          placeholder: 'Paste tab-separated or CSV lines…',
          rows: 5,
          value: state.importText,
          onInput: e => { state.importText = e.target.value; },
          onKeydown: e => { if (e.key === 'Enter') e.stopPropagation(); },
        }),
        el('div', { className: 'toolbar' },
          btn('Preview import', { onClick: runImportPreview }),
          btn('Upload file', { onClick: () => document.getElementById('import-txt-input').click() }),
        ),
      );

      importBlock.appendChild(el('input', {
        id: 'import-txt-input',
        type: 'file',
        accept: '.txt,.csv,text/plain,text/csv',
        className: 'hidden',
        onChange: handleImportFile,
      }));

      if (state.importPreview) {
        const preview = el('div', { style: { marginTop: '12px' } });
        state.importPreview.errors.forEach(msg => preview.appendChild(el('p', { className: 'alert', style: { marginTop: '8px' } }, msg)));
        if (state.importPreview.cards.length > 0) {
          preview.appendChild(el('p', { className: 'hint' },
            state.importPreview.cards.length + ' cards — preview: ' +
            state.importPreview.cards.slice(0, 3).map(c => c.front).join(', ') + '…'));
          preview.appendChild(btn('Add to deck', { variant: 'primary', onClick: applyImport, style: { marginTop: '8px' } }));
        }
        importBlock.appendChild(preview);
      }

      frag.appendChild(importBlock);

      const cardList = el('ul', { className: 'card-list' });
      (deck.cards || []).forEach(c => {
        cardList.appendChild(el('li', { className: 'card-row' },
          el('input', {
            className: 'input',
            placeholder: 'Front',
            value: c.front,
            onInput: e => { c.front = e.target.value; },
            onBlur: saveCardsOnBlur,
          }),
          el('input', {
            className: 'input',
            placeholder: 'Back',
            value: c.back,
            onInput: e => { c.back = e.target.value; },
            onBlur: saveCardsOnBlur,
          }),
          btn('×', { variant: 'ghost', onClick: () => removeCard(c.id) }),
        ));
      });
      frag.appendChild(cardList);

      frag.appendChild(el('div', { className: 'data-toolbar' },
        el('p', { className: 'block-title' }, 'This deck'),
        el('div', { className: 'toolbar' },
          btn('Export deck JSON', { onClick: () => exportDeck(deck) }),
        ),
      ));

      return frag;
    }

    function render() {
      if (activePresenter) { activePresenter.destroy(); activePresenter = null; }
      if (activeStudy) { activeStudy.destroy(); activeStudy = null; }

      root.innerHTML = '';

      if (state.view === 'present' && state.present) {
        activePresenter = renderPresenter(state.present.deck, state.present.mode, () => {
          refreshDecks();
          setState({ view: state.editingDeck ? 'edit' : 'list', present: null, decks: state.decks });
        });
        root.appendChild(activePresenter.el);
        return;
      }

      if (state.view === 'study' && state.study) {
        const back = el('button', { type: 'button', className: 'back-link', onClick: () => setState({ view: state.editingDeck ? 'edit' : 'list', study: null }) }, '← Back');
        root.appendChild(back);
        activeStudy = renderStudySession(state.study.deck, state.study.mode, () => {
          refreshDecks();
          if (state.editingDeck) {
            const fresh = loadDecks().find(d => d.id === state.editingDeck.id);
            if (fresh) state.editingDeck = { ...fresh, cards: [...(fresh.cards || [])] };
          }
          setState({ view: state.editingDeck ? 'edit' : 'list', study: null, decks: state.decks });
        });
        root.appendChild(activeStudy.el);
        return;
      }

      if (state.view === 'edit') root.appendChild(renderEdit());
      else root.appendChild(renderList());
    }

    // --- Actions ---

    function handleCreateDeck() {
      const name = state.newDeckName.trim() || ('Deck ' + (state.decks.length + 1));
      const deck = createDeck(name, []);
      refreshDecks();
      setState({ newDeckName: '', editingDeck: deck, view: 'edit', error: '' });
    }

    function handleDeleteDeck(id) {
      if (!confirm('Delete this deck?')) return;
      deleteDeck(id);
      refreshDecks();
      setState({ decks: state.decks, error: '' });
    }

    function openEdit(id) {
      refreshDecks();
      const deck = loadDecks().find(d => d.id === id);
      if (!deck) return;
      setState({
        editingDeck: { ...deck, cards: [...(deck.cards || [])] },
        view: 'edit',
        importText: '',
        importPreview: null,
        decks: state.decks,
      });
    }

    function addCard() {
      const deck = state.editingDeck;
      deck.cards = [...(deck.cards || []), { id: newCardId(), front: '', back: '' }];
      const updated = updateDeck(deck.id, { cards: deck.cards });
      if (updated) state.editingDeck = updated;
      render();
    }

    function saveCardsOnBlur() {
      const updated = updateDeck(state.editingDeck.id, { cards: state.editingDeck.cards });
      if (updated) state.editingDeck = updated;
      refreshDecks();
    }

    function removeCard(cardId) {
      const deck = state.editingDeck;
      deck.cards = deck.cards.filter(c => c.id !== cardId);
      const updated = updateDeck(deck.id, { cards: deck.cards });
      if (updated) state.editingDeck = updated;
      render();
    }

    function runImportPreview() {
      setState({ importPreview: parseFlashcardImport(state.importText) });
    }

    function applyImport() {
      if (!state.importPreview?.cards?.length || !state.editingDeck) return;
      const merged = [...(state.editingDeck.cards || []), ...state.importPreview.cards];
      const updated = updateDeck(state.editingDeck.id, { cards: normalizeCards(merged) });
      if (updated) {
        setState({ editingDeck: updated, importText: '', importPreview: null });
      }
    }

    function handleImportFile(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        state.importText = reader.result;
        setState({ importPreview: parseFlashcardImport(reader.result) });
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function startPresent(opts) {
      refreshDecks();
      const deck = loadDecks().find(d => d.id === opts.deck.id) || opts.deck;
      setState({ view: 'present', present: { deck, mode: opts.mode } });
    }

    function startStudy(opts) {
      refreshDecks();
      const deck = loadDecks().find(d => d.id === opts.deck.id) || opts.deck;
      setState({ view: 'study', study: { deck, mode: opts.mode } });
    }

    function exportDeck(deck) {
      const safe = (deck.name || 'deck').replace(/[^\w\-]+/g, '_').slice(0, 40);
      downloadJson(safe + '.json', { version: 1, deck });
    }

    function exportAllDecks() {
      downloadJson('vocab-cards-backup.json', { version: 1, decks: loadDecks() });
    }

    function handleImportJson(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          let imported = 0;

          if (data.deck) {
            const d = data.deck;
            createDeck(d.name || 'Imported deck', d.cards || []);
            imported = 1;
          } else if (Array.isArray(data.decks)) {
            data.decks.forEach(d => {
              createDeck(d.name || 'Imported deck', d.cards || []);
              imported++;
            });
          } else {
            setState({ error: 'Unrecognized JSON format.' });
            return;
          }

          refreshDecks();
          setState({ error: '', decks: state.decks });
          alert('Imported ' + imported + ' deck(s).');
        } catch (err) {
          setState({ error: 'Could not parse JSON: ' + err.message });
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    // Boot
    render();
  </script>
</body>
</html>
